<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@200;300;400&family=Pixelify+Sans:wght@400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.scene {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 44%, #C8D7FF 0%, #A0ACCC 15%, #523D99 60%, #21170E 100%);
  overflow: hidden;
  position: relative;
}

.key-float { will-change: transform; }
.key-stage { perspective: 920px; perspective-origin: 50% 25%; }

.key {
  transform-style: preserve-3d;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}

.key-bevel {
  position: relative;
  width: 224px;
  height: 224px;
  border-radius: var(--bevel-r, 22px);
  overflow: hidden;
  --in-top: 26px; --in-bottom: 26px; --in-left: 26px; --in-right: 26px;
  --wall-top: #57534F; --wall-bottom: #44403C; --wall-left: #302D2A; --wall-right: #1E1A17;
  --stop-top: 24%; --stop-bottom: 26%; --stop-left: 24%; --stop-right: 26%;
}

.key-wall { position: absolute; inset: 0; pointer-events: none; z-index: 0; }

.key-wall--top {
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--in-right)) var(--in-top), var(--in-left) var(--in-top));
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--wall-top) 100%, white 16%) 0%,
    var(--wall-top) var(--stop-top),
    color-mix(in srgb, var(--wall-top) 100%, black 38%) 100%);
}
.key-wall--bottom {
  clip-path: polygon(0 100%, 100% 100%, calc(100% - var(--in-right)) calc(100% - var(--in-bottom)), var(--in-left) calc(100% - var(--in-bottom)));
  background: linear-gradient(to top,
    color-mix(in srgb, var(--wall-bottom) 100%, white 8%) 0%,
    var(--wall-bottom) var(--stop-bottom),
    color-mix(in srgb, var(--wall-bottom) 100%, black 34%) 100%);
}
.key-wall--left {
  clip-path: polygon(0 0, var(--in-left) var(--in-top), var(--in-left) calc(100% - var(--in-bottom)), 0 100%);
  background: linear-gradient(to right,
    color-mix(in srgb, var(--wall-left) 100%, white 15%) 0%,
    var(--wall-left) var(--stop-left),
    color-mix(in srgb, var(--wall-left) 100%, black 36%) 100%);
}
.key-wall--right {
  clip-path: polygon(100% 0, calc(100% - var(--in-right)) var(--in-top), calc(100% - var(--in-right)) calc(100% - var(--in-bottom)), 100% 100%);
  background: linear-gradient(to left,
    color-mix(in srgb, var(--wall-right) 100%, white 7%) 0%,
    var(--wall-right) var(--stop-right),
    color-mix(in srgb, var(--wall-right) 100%, black 33%) 100%);
}

.key-face {
  position: absolute;
  --face-offset: 3.5px;
  left: calc(var(--in-left) - var(--face-offset));
  top: calc(var(--in-top) - var(--face-offset));
  width: calc(100% - var(--in-left) - var(--in-right) + var(--face-offset) * 2);
  height: calc(100% - var(--in-top) - var(--in-bottom) + var(--face-offset) * 2);
  border-radius: var(--face-r, 12px);
  z-index: 1;
  overflow: hidden;
  background:
    radial-gradient(ellipse 75% 65% at var(--hl-x, 38%) var(--hl-y, 34%), #3B3734 0%, #2C2926 32%, #1C1917 66%, #0F0D0C 100%),
    linear-gradient(to top, rgba(92, 92, 106, 0.07) 0%, transparent 22%);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.07s ease-in;
}
.key-face::before {
  content: '';
  position: absolute; inset: 0;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.015) 36%, transparent 60%);
  pointer-events: none; z-index: 2;
}
.key-float.pressed .key-face {
  background:
    radial-gradient(ellipse 75% 65% at var(--hl-x, 38%) var(--hl-y, 34%), #302E2D 0%, #22201F 32%, #141311 66%, #090807 100%),
    linear-gradient(to top, rgba(92, 92, 106, 0.05) 0%, transparent 22%);
}

.key-label {
  position: relative; z-index: 3;
  color: rgba(255, 255, 255, 0.9);
  font-family: 'Pixelify Sans', monospace;
  font-size: 40px; font-weight: 400; letter-spacing: 0.25px;
}

.text-block {
  position: fixed; top: 14vh; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 640px;
  padding: 0 1.5rem; text-align: left;
  pointer-events: none; z-index: 10;
}
.title {
  font-family: 'Bai Jamjuree', sans-serif;
  font-size: 4.5rem; font-weight: 200;
  letter-spacing: -0.2rem; color: #fff; line-height: 1;
}
.description {
  margin-top: 1.5rem;
  font-family: 'Bai Jamjuree', sans-serif;
  font-size: 1.4rem; font-weight: 300;
  color: rgba(255, 255, 255, 0.75); line-height: 1.5;
}
@media (max-width: 640px) {
  .title { font-size: 3rem; letter-spacing: -0.12rem; }
  .description { font-size: 1.1rem; margin-top: 1rem; }
}

.hint {
  position: fixed; bottom: 28px; left: 0; right: 0;
  text-align: center;
  font-family: 'Bai Jamjuree', sans-serif;
  font-size: 12px; color: #fff; opacity: 0.5;
  letter-spacing: 0.5px; pointer-events: none;
}
</style>
</head>
<body>
<div class="scene">
  <div class="text-block">
    <h1 class="title">Page not found</h1>
    <p class="description">It seems like the page you're looking for doesn't exist, let's go back to the homepage</p>
  </div>
  <div class="key-float" id="float">
    <div class="key-stage" id="stage">
      <div class="key" role="button" aria-label="404 key" tabindex="0">
        <div class="key-bevel" id="bevel">
          <div class="key-wall key-wall--top"></div>
          <div class="key-wall key-wall--bottom"></div>
          <div class="key-wall key-wall--left"></div>
          <div class="key-wall key-wall--right"></div>
          <div class="key-face" id="face">
            <span class="key-label">404</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <p class="hint">Nudge the keyboard fidget by pressing, holding, and releasing it</p>
</div>

<script>
(function () {
  var REST_Y = 0, PRESS_Y = 10, REBOUND_PEAK = -15, REBOUND_MS = 820, PRESS_DOWN_MS = 180, MIN_HOLD_MS = 240;
  var WALL_BASE = { top: [92, 92, 100], bottom: [30, 30, 36], left: [74, 74, 82], right: [44, 44, 52] };

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function rand(min, max) { return min + Math.random() * (max - min); }
  function shadeColor(rgb, f) {
    var c = rgb.map(function (v) { return Math.max(0, Math.min(255, Math.round(v * f))); });
    return 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')';
  }

  var el = document.getElementById('float');
  var bevel = document.getElementById('bevel');
  var face = document.getElementById('face');
  var stage = document.getElementById('stage');

  var s = {
    phase: 'idle', posY: REST_Y, velY: 0, driftX: 0, driftZ: 0,
    rotX: 0, rotY: 0, rotZ: 0, angVelX: 0, angVelY: 0, angVelZ: 0,
    pressStart: 0, releasePending: false, releaseAt: 0,
    reboundStart: 0, reboundRotX: 0, reboundRotY: 0, reboundRotZ: 0,
    driftPhaseX: 0, driftPhaseZ: 0, driftFreqX: 0.14, driftFreqZ: 0.11,
    oscPhaseX: 0, oscPhaseY: 0, oscPhaseZ: 0, oscFreqX: 0.33, oscFreqY: 0.30, oscFreqZ: 0.27
  };

  function randomizeReboundRotation() {
    s.reboundRotX = rand(1, 3) * (Math.random() < 0.5 ? -1 : 1);
    s.reboundRotY = rand(1, 3) * (Math.random() < 0.5 ? -1 : 1);
    s.reboundRotZ = rand(1, 3) * (Math.random() < 0.5 ? -1 : 1);
  }
  function randomizeDrift() {
    s.driftFreqX = rand(0.10, 0.18); s.driftFreqZ = rand(0.08, 0.15);
    s.driftPhaseX = rand(0, Math.PI * 2); s.driftPhaseZ = rand(0, Math.PI * 2);
    s.oscFreqX = rand(0.25, 0.42); s.oscFreqY = rand(0.22, 0.38); s.oscFreqZ = rand(0.20, 0.35);
    s.oscPhaseX = rand(0, Math.PI * 2); s.oscPhaseY = rand(0, Math.PI * 2); s.oscPhaseZ = rand(0, Math.PI * 2);
  }
  function press(now) {
    s.phase = 'pressing'; s.pressStart = now; s.posY = REST_Y; s.velY = 0;
    s.releasePending = false; s.driftX = 0; s.driftZ = 0;
    s.rotX = 0; s.rotY = 0; s.rotZ = 0;
  }
  function startRebound(now) {
    s.phase = 'rebound'; s.reboundStart = now; s.releasePending = false;
    randomizeReboundRotation();
  }
  function release(now) {
    if (s.phase !== 'pressing' && s.phase !== 'pressed') return;
    var elapsed = now - s.pressStart;
    if (elapsed < MIN_HOLD_MS) { s.releasePending = true; s.releaseAt = s.pressStart + MIN_HOLD_MS; }
    else startRebound(now);
  }
  function step(now, dt) {
    if (s.phase !== 'pressing' && s.phase !== 'pressed') {
      s.driftX = Math.sin(now * 0.001 * s.driftFreqX + s.driftPhaseX) * 22;
      s.driftZ = Math.sin(now * 0.001 * s.driftFreqZ + s.driftPhaseZ) * 14;
    }
    if (s.phase === 'pressing') {
      var elapsed = now - s.pressStart;
      var t = Math.min(elapsed / PRESS_DOWN_MS, 1);
      s.posY = REST_Y + (PRESS_Y - REST_Y) * easeOutCubic(t);
      if (t >= 1) s.phase = 'pressed';
      if (s.releasePending && now >= s.releaseAt) startRebound(now);
      return;
    }
    if (s.phase === 'pressed') {
      s.posY = PRESS_Y; s.rotX = 0; s.rotY = 0; s.rotZ = 0;
      if (s.releasePending && now >= s.releaseAt) startRebound(now);
      return;
    }
    if (s.phase === 'rebound') {
      var e2 = now - s.reboundStart;
      var t2 = Math.min(e2 / REBOUND_MS, 1);
      var k = 3.2, w = 9.5;
      var decay = Math.exp(-k * t2);
      var osc = Math.cos(w * t2);
      s.posY = REST_Y + (PRESS_Y - REST_Y) * decay * osc;
      if (s.posY < REBOUND_PEAK) s.posY = REBOUND_PEAK;
      s.velY = 0;
      var rd = 1 - t2;
      s.rotX = s.reboundRotX * rd;
      s.rotY = s.reboundRotY * rd;
      s.rotZ = s.reboundRotZ * rd;
      if (t2 >= 1) {
        s.phase = 'idle';
        s.angVelX = s.reboundRotX * 0.3 * (Math.random() < 0.5 ? -1 : 1);
        s.angVelY = s.reboundRotY * 0.25 * (Math.random() < 0.5 ? -1 : 1);
        s.angVelZ = s.reboundRotZ * 0.2 * (Math.random() < 0.5 ? -1 : 1);
        s.rotX = 0; s.rotY = 0; s.rotZ = 0; s.posY = REST_Y;
      }
      return;
    }
    s.posY = REST_Y;
    s.rotX += (s.angVelX + Math.sin(now * 0.001 * s.oscFreqX + s.oscPhaseX) * 0.8) * dt;
    s.rotY += (s.angVelY + Math.sin(now * 0.001 * s.oscFreqY + s.oscPhaseY) * 0.7) * dt;
    s.rotZ += (s.angVelZ + Math.sin(now * 0.001 * s.oscFreqZ + s.oscPhaseZ) * 0.6) * dt;
    s.angVelX *= 0.9995; s.angVelY *= 0.9995; s.angVelZ *= 0.9995;
  }

  randomizeDrift();

  var raf = 0, last = performance.now();
  function loop(now) {
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    step(now, dt);

    var isHeld = s.phase === 'pressing' || s.phase === 'pressed';
    var baseX = isHeld ? 0 : 7 + s.driftZ * 0.04;
    var baseY = isHeld ? 0 : -5 + s.driftX * 0.025;
    var tiltX = baseX + s.rotX;
    var tiltY = baseY + s.rotY;

    var pressProgress =
      s.phase === 'pressing' ? easeOutCubic(Math.min((now - s.pressStart) / PRESS_DOWN_MS, 1)) :
      (s.phase === 'pressed') ? 1 : 0;
    var pressDepth = 1 - 0.18 * pressProgress;
    el.style.transform =
      'translate3d(' + s.driftX.toFixed(2) + 'px, ' + s.posY.toFixed(2) + 'px, ' + s.driftZ.toFixed(2) + 'px) ' +
      'scale(' + pressDepth.toFixed(3) + ') ' +
      'rotateX(' + tiltX.toFixed(2) + 'deg) ' +
      'rotateY(' + tiltY.toFixed(2) + 'deg) ' +
      'rotateZ(' + s.rotZ.toFixed(2) + 'deg)';

    var front = Math.max(-1, Math.min(1, tiltX / 24));
    var left = Math.max(-1, Math.min(1, tiltY / 24));
    var back = -front, right = -left;

    var bw = 26, dw = 11;
    var pressSquash = 1 - 0.6 * pressProgress;
    var reboundBoost = s.phase === 'rebound' ? 1 + Math.max(0, (REBOUND_PEAK - s.posY) * 0.012) : 1;

    var bevelR = 22 - 6 * pressProgress;
    var faceR = 12 - 3 * pressProgress;
    bevel.style.setProperty('--bevel-r', bevelR.toFixed(1) + 'px');
    face.style.setProperty('--face-r', faceR.toFixed(1) + 'px');

    var inTop = (bw + back * dw) * pressSquash * reboundBoost;
    var inBottom = (bw + front * dw) * pressSquash * reboundBoost;
    var inLeft = (bw + left * dw) * pressSquash * reboundBoost;
    var inRight = (bw + right * dw) * pressSquash * reboundBoost;
    bevel.style.setProperty('--in-top', inTop.toFixed(1) + 'px');
    bevel.style.setProperty('--in-bottom', inBottom.toFixed(1) + 'px');
    bevel.style.setProperty('--in-left', inLeft.toFixed(1) + 'px');
    bevel.style.setProperty('--in-right', inRight.toFixed(1) + 'px');

    bevel.style.setProperty('--wall-top', shadeColor(WALL_BASE.top, 1 + back * 0.30));
    bevel.style.setProperty('--wall-bottom', shadeColor(WALL_BASE.bottom, 1 + front * 0.32));
    bevel.style.setProperty('--wall-left', shadeColor(WALL_BASE.left, 1 + left * 0.28));
    bevel.style.setProperty('--wall-right', shadeColor(WALL_BASE.right, 1 + right * 0.28));

    var stopTop = Math.max(10, Math.min(40, 24 + back * 12));
    var stopBottom = Math.max(14, Math.min(44, 26 + front * 12));
    var stopLeft = Math.max(10, Math.min(40, 24 + left * 12));
    var stopRight = Math.max(14, Math.min(44, 26 + right * 12));
    bevel.style.setProperty('--stop-top', stopTop.toFixed(1) + '%');
    bevel.style.setProperty('--stop-bottom', stopBottom.toFixed(1) + '%');
    bevel.style.setProperty('--stop-left', stopLeft.toFixed(1) + '%');
    bevel.style.setProperty('--stop-right', stopRight.toFixed(1) + '%');

    var hlX = 38 - left * 16;
    var hlY = 34 + front * 16;
    face.style.setProperty('--hl-x', hlX.toFixed(1) + '%');
    face.style.setProperty('--hl-y', hlY.toFixed(1) + '%');

    var persp = 920 + Math.sin(now * 0.001 * 0.11) * 36 + s.driftZ * 0.5;
    var poX = 50 + tiltY * 0.25;
    var poY = 25 + tiltX * 0.18;
    stage.style.perspective = persp.toFixed(0) + 'px';
    stage.style.perspectiveOrigin = poX.toFixed(1) + '% ' + poY.toFixed(1) + '%';

    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);

  function pressFn() {
    if (s.phase !== 'pressing' && s.phase !== 'pressed') {
      press(performance.now());
      el.classList.add('pressed');
    }
  }
  function releaseFn() {
    if (s.phase === 'pressing' || s.phase === 'pressed') {
      el.classList.remove('pressed');
      release(performance.now());
    }
  }

  el.addEventListener('mousedown', pressFn);
  el.addEventListener('mouseup', releaseFn);
  el.addEventListener('mouseleave', releaseFn);
  el.addEventListener('touchstart', pressFn, { passive: true });
  el.addEventListener('touchend', releaseFn);
  el.addEventListener('touchcancel', releaseFn);
})();
</script>
</body>
</html>
