<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spline 3D</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>

  <canvas id="canvas3d"></canvas>

  <script src="https://unpkg.com/@splinetool/runtime@1.12.63/build/runtime.js"></script>

  <script>
    const canvas = document.getElementById('canvas3d');

    const app = new Application(canvas);

    app.load('scene.splinecode');
  </script>

</body>
</html>
